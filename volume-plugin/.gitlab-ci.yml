stages:
  - build

build:
  stage: build
  image: golang:1.23
  script:
    # Ceph libs from debian bookworm (pacific 16.2.x) — same as the Dockerfile.
    # The old download.ceph.com reef repo line never applied on bookworm.
    - apt-get update && apt-get install -yq libcephfs-dev librbd-dev librados-dev
    - go install -v
    - go vet ./...
  tags:
    - docker
