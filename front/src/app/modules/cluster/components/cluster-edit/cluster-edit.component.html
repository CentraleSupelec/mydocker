<h1 class="mat-display-1">{{ 'admin.resources_management.clusters.edit.title' | translate }} "{{ cluster?.name }}"</h1>
<app-cluster-form
  [formControl]="clusterForm"
></app-cluster-form>

<div fxLayout="row" fxLayoutAlign="flex-end">

    {{ 'admin.resources_management.clusters.edit.save' | translate }}
  </button>
</div>
