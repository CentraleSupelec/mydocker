<h1 class="mat-display-1">Créer un nouveau contenu</h1>

<app-content-form
  [formControl]="contentForm"
></app-content-form>

<div fxLayout="row" fxLayoutAlign="flex-end">
  <button mat-raised-button [disabled]="contentForm.invalid" (click)="submit()" color="primary">
    Créer le contenu
  </button>
</div>
