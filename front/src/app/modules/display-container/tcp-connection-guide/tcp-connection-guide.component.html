<div fxLayout="column">
  <strong>{{ 'container.tcp_access' | translate }}
    <span *ngIf="containerPort?.description !== 'default'">{{ 'container.to' | translate }} "{{ containerPort?.description }}"</span>:&nbsp;
  </strong>
  <div fxLayout="row" fxLayoutAlign="start center" style="margin-left: 15px">
    <code>
      IP : {{ ipAddress }}
    </code>
    <button mat-icon-button (click)="copyIpAddress()">
      <mat-icon>content_copy</mat-icon>
    </button>
  </div>
  <div fxLayout="row" fxLayoutAlign="start center" style="margin-left: 15px">
    <code>
      Port : {{ containerPort?.portMapTo }}
    </code>
    <button mat-icon-button (click)="copyPort()">
      <mat-icon>content_copy</mat-icon>
    </button>
  </div>
</div>
