<div fxLayout="column">
  <strong>{{ 'container.web_access' | translate }}
    <span *ngIf="containerPort?.description !== 'default'">{{ 'container.to' | translate }} "{{ containerPort?.description }}"</span>:&nbsp;
  </strong>
  <div fxLayout="row" fxLayoutAlign="start center" style="margin-left: 15px">
    <a
      mat-raised-button
      color="primary"
      href="{{ getContainerUrl() }}"
      target="_blank"
      rel="noopener noreferrer"
      style="margin-top: 5px"
      matTooltip="http://{{ ipAddress }}:{{ containerPort?.portMapTo }}"
      matTooltipShowDelay=1500
    >
      {{ 'container.connection' | translate }}
    </a>
  </div>
</div>
