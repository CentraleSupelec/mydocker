<h1 class="mat-display-1">{{ 'admin.courses.title' | translate }}</h1>

<app-courses-list
  [stopContainerPolling$]="stopContainerPolling$"
  [buttonCell]="buttonCell"
  [expandedRow]="expandedRow"
  [expandedElement]="expandedElement"
>
</app-courses-list>
<ng-template #buttonCell let-element>
  <ng-container *ngxPermissionsOnly="['course.' + element.id + '.edit', 'course.' + element.id + '.creator', 'ROLE_ADMIN']">
    <a
      mat-icon-button
      [href]="element.link|generateJoinLink"
      target="_blank"
    >
      <mat-icon
        [matTooltip]="'admin.courses.actions.test' | translate"
      >play_circle_filled</mat-icon>
    </a>
  </ng-container>

  <button mat-icon-button (click)="copyLink($event, element.link)" [matTooltip]="'admin.courses.actions.copy_invitation_link' | translate">
    <mat-icon>content_copy</mat-icon>
  </button>

  <ng-container *ngxPermissionsOnly="['course.' + element.id + '.edit', 'course.' + element.id + '.creator', 'ROLE_ADMIN']">
    <a
      mat-icon-button
      [routerLink]="[element.id, 'edit']"
      [matTooltip]="'admin.courses.actions.edit' | translate"
    >
      <mat-icon>edit</mat-icon>
    </a>
  </ng-container>

  <button mat-icon-button [matMenuTriggerFor]="menu" [matTooltip]="'admin.courses.actions.more' | translate">
      <mat-icon>arrow_drop_down</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <div class="course-admin-action-menu">
      <ng-template
        [ngxPermissionsOnly]="['course.' + element.id + '.edit', 'course.' + element.id + '.creator', 'ROLE_ADMIN']"
        [ngxPermissionsOnlyThen]="thenBlock"
        [ngxPermissionsOnlyElse]="elseBlock"
      >
      </ng-template>
    </div>
  </mat-menu>

  <ng-template #thenBlock>
    <button
      mat-menu-item
      [matTooltip]="'admin.courses.actions.access_students_work' | translate"
      (click)="askAdminContainer($event, element)"
      *ngIf="element?.saveStudentWork && element?.allowStudentToSubmit"
    >
      <mat-icon class="material-symbols-outlined">home_storage</mat-icon>
      <span>{{ 'admin.courses.actions.access_students_work' | translate }}</span>
    </button>
    <button
      mat-menu-item
      (click)="duplicate(element, $event)"
      [matTooltip]="'admin.courses.actions.duplicate' | translate"
    >
      <mat-icon>control_point_duplicate</mat-icon>
      <span>{{ 'admin.courses.actions.duplicate' | translate }}</span>
    </button>
  </ng-template>
  <ng-template #elseBlock>
    <button
      mat-menu-item
      [routerLink]="[element.id, 'edit']"
      [matTooltip]="'admin.courses.actions.view' | translate"
      *ngxPermissionsOnly="['course.' + element.id + '.view']"
    >
      <mat-icon>visibility</mat-icon>
      <span>{{ 'admin.courses.actions.view' | translate }}</span>
    </button>
    <button
      mat-menu-item
      [routerLink]="[element.id, 'edit']"
      [matTooltip]="'admin.courses.actions.view' | translate"
      *ngIf="element.visible"
    >
      <mat-icon>visibility</mat-icon>
      <span>{{ 'admin.courses.actions.view' | translate }}</span>
    </button>
    <button
      mat-menu-item
      (click)="duplicate(element, $event)"
      [matTooltip]="'admin.courses.actions.duplicate' | translate"
    >
      <mat-icon>control_point_duplicate</mat-icon>
      <span>{{ 'admin.courses.actions.duplicate' | translate }}</span>
    </button>
  </ng-template>
</ng-template>

<ng-template #expandedRow let-element>
  <div *ngIf="askContainer">
    <br>
    <div *ngIf="container !== null; then thenBlock else elseBlock"></div>

    <ng-template #thenBlock>
      <app-display-container
        [container]="container"
      ></app-display-container>
      <div fxLayout="column" fxLayoutAlign="center center" fxFill>
        <button mat-raised-button color="warn" (click)="forceRecreateAdminContainer(element)">
          {{ 'container.request_new_environment' | translate }}
        </button>
      </div>
      <br>
    </ng-template>

    <ng-template #elseBlock>
      <div fxLayout="column" fxLayoutAlign="center center" fxFill>
        <mat-spinner></mat-spinner>
        <p style="margin-top: 10px">{{ 'container.wait_creation' | translate }}</p>
      </div>
    </ng-template>
  </div>
</ng-template>
