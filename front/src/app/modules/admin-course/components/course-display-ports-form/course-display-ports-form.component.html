<div [formGroup]="formGroup" fxLayout="column">
  <ng-container *ngFor="let port of formGroup.controls | keyvalue">
    <mat-checkbox [formControlName]="port.key">
      {{ 'admin.courses.edit.technical_info.display_options.view_port' | translate }} {{ port.key }}
    </mat-checkbox>
  </ng-container>
</div>
