<div fxLayout="row" fxLayoutAlign="space-between start">
  <h1 class="mat-display-1">{{ 'admin.courses.edit.title' | translate }}: {{ course?.title }}</h1>
  <div fxLayout="row" fxLayoutAlign="end center">
    <button
      mat-icon-button
      (click)="openShareDialog()"
      *ngxPermissionsOnly="['ROLE_ADMIN', 'course.' + course?.id + '.creator']"
    >
      <mat-icon>share</mat-icon>
    </button>
    <ng-container *ngIf="course?.status !== deletedStatus">
      <button
        mat-button
        color="warn"
        (click)="delete()"
        *ngxPermissionsOnly="['ROLE_ADMIN', 'course.' + course?.id + '.edit', 'course.' + course?.id + '.creator']"
      >
        {{ 'admin.courses.edit.delete.button' | translate }}
      </button>
    </ng-container>
  </div>
</div>

<app-course-form
  *ngIf="computeTypes"
  [computeTypes]="computeTypes"
  [slurmClusters]="slurmClusters || []"
  [formControl]="courseForm"
  [sessionsById]="sessionsById"
  [courseUuid]="course?.uuid"
  [clusters]="clusters"
></app-course-form>

<div fxLayout="row" fxLayoutAlign="flex-end">
  <button mat-raised-button [disabled]="courseForm.invalid || !courseForm.dirty || courseForm.disabled" (click)="submit()" color="primary">
    {{ 'admin.courses.edit.save' | translate }}
  </button>
</div>
