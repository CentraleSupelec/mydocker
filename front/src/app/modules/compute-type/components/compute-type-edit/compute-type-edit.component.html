<h1 class="mat-display-1">{{ 'admin.resources_management.compute_types.edit.title' | translate }} "{{ computeType?.displayName }}"</h1>
<app-compute-type-form
  [formControl]="computeTypeForm"
  [regions]="regions"
  [resources]="ovhResources"
></app-compute-type-form>

<div fxLayout="row" fxLayoutAlign="flex-end">
  <button mat-raised-button [disabled]="computeTypeForm.invalid  || computeTypeForm.disabled" (click)="submit()" color="primary">
    {{ 'admin.resources_management.compute_types.edit.save' | translate }}
  </button>
</div>
