<h1 class="mat-display-1">{{ 'admin.users_management.users.edit.title' | translate }}: {{ user?.lastname + ' ' + user?.name }} </h1>

<app-user-form
  [formControl]="userForm"
></app-user-form>

<div fxLayout="row" fxLayoutAlign="flex-end">
  <button mat-raised-button [disabled]="userForm.invalid || !userForm.dirty || userForm.disabled" (click)="submit()" color="primary">
    {{ 'admin.users_management.users.edit.save' | translate }}
  </button>
</div>
