<div fxLayout="column" fxLayoutAlign="center center" fxFill fxLayoutGap="5px">
  <button mat-raised-button color="primary" (click)="saveData()">
    {{ 'container.save_state.submit' | translate }}
  </button>
  <p class="save-information" *ngIf="saveState?.savedAt !== null">
    {{ 'container.save_state.last_submission_date' | translate: {
      date : (saveState?.savedAt | date: 'dd/mm/yyyy'),
      time : (saveState?.savedAt | date: 'HH:mm')
      }
    }}
  </p>
  <p class="save-information" *ngIf="saveState?.savedAt === null">
    {{ 'container.save_state.no_submission' | translate }}
  </p>
</div>
