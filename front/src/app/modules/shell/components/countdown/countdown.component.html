<div class="countdown-container">
  <mat-icon inline class="alarm">alarm</mat-icon>
  <div>
    <div class="mat-caption">{{ 'container.shutdown_in' | translate }}</div>
    <div class="mat-title time">{{hoursToDday}}h{{minutesToDday}}m{{secondsToDday}}s</div>
  </div>
</div>
<button mat-raised-button color="warn" (click)="delayDeletion()" [disabled]="delayPending">
  {{ 'container.reinitialze_countdown' | translate }}
</button>
