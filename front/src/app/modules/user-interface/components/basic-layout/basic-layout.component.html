<mat-toolbar color="primary">
  <div>
    <span [routerLink]="'/'" style="cursor: pointer">{{ appName }}</span>

    <ng-container *ngFor="let element of information">
      <a
        [href]="element.url"
        target="_blank"
        style="color: inherit; text-decoration: none;margin-left: 20px;"
        class="mat-body">
        {{ element.title[currentLang] }}
      </a>
    </ng-container>
  </div>
  <span class="spacer"></span>
  <span class="mat-body" [matTooltip]="userInfo">{{ email }}</span>
  <a
    mat-icon-button
    routerLink="/admin"
    *ngxPermissionsOnly="['ROLE_TEACHER', 'ROLE_ADMIN']"
    [matTooltip]="'home.admin_page' | translate" >
    <mat-icon>admin_panel_settings</mat-icon>
  </a>
  <button mat-icon-button [matMenuTriggerFor]="langMenu">
    <span style="font-size: 20px;">{{ currentFlag }}</span>
  </button>
  <mat-menu #langMenu="matMenu">
    <button
      mat-menu-item
      *ngFor="let lang of languages"
      (click)="switchLang(lang.code)">

      <span style="margin-right: 8px;">
        {{ lang.flag }}
      </span>

      {{ lang.label }}
    </button>
  </mat-menu>
  <button mat-icon-button (click)="logout()" [matTooltip]="'home.logout' | translate">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<div fxLayout="column" fxLayoutAlign="flex-start center" style="height: calc(100vh - 64px); overflow: scroll;">
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</div>
