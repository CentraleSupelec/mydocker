databaseChangeLog:
- changeSet:
    id: 1792000000000-1
    author: snesiubedreag
    comment: >-
      Make clusters.name unique.

      The back end keys its gRPC channels and per-cluster streams by cluster name, so two
      clusters sharing a name would share one connection. The admin route refuses a taken name
      with a 409; the constraint holds it against concurrent writes.
    preConditions:
    - onFail: HALT
    - onFailMessage: >
        Unique constraint on clusters (name) halted: at least two clusters share a name.
        Rename one, then restart the back end; nothing has been recorded, so the rerun
        re-evaluates cleanly. Duplicates are listed by:
        SELECT id, name, go_address, go_port FROM clusters WHERE name IN
        (SELECT name FROM clusters GROUP BY name HAVING count(*) > 1) ORDER BY name, id;
    - sqlCheck:
        expectedResult: "0"
        sql: |
          SELECT count(*) FROM (
            SELECT 1 FROM clusters GROUP BY name HAVING count(*) > 1
          ) duplicates
    changes:
    - addUniqueConstraint:
        tableName: clusters
        columnNames: name
        constraintName: uk_clusters_name
    rollback:
    - dropUniqueConstraint:
        tableName: clusters
        constraintName: uk_clusters_name
