- changeSet:
    id: 1779745457814-6
    author: mohamedalibarka
    changes:
      - sql:
          sql: |
            INSERT INTO resource (
                compute_type_id,
                resource_id,
                region_region
            )
            SELECT
                ct.id,
                ct.autoscaling_resource_id,
                car.autoscaling_regions_region
            FROM compute_types ct
            INNER JOIN compute_types_autoscaling_regions car
                ON car.compute_type_id = ct.id
            WHERE ct.autoscaling_resource_id IS NOT NULL;
