databaseChangeLog:
- changeSet:
    id: 1791244800000-1
    author: snesiubedreag
    comment: >-
      Seed the login-announcement block, disabled. It is the one content block readable without
      being logged in, so the front can show it on the login page as well as on the student
      environment list.
    preConditions:
    # An admin may already have created a block titled "Login announcement", which gets this
    # slug; keep that row rather than failing startup on the unique constraint.
    - onFail: MARK_RAN
    - sqlCheck:
        expectedResult: "0"
        sql: SELECT count(*) FROM content WHERE slug = 'login-announcement'
    changes:
      - insert:
          tableName: content
          columns:
            - column:
                name: enabled
                valueBoolean: false
            - column:
                name: rich_text
                value: |
                  <h1 class="editor-heading-h1" dir="ltr"><span style="white-space: pre-wrap;">Vous pouvez remplacer ce message par une annonce de fermeture du service, en y indiquant les dates de fermeture.</span></h1><p dir="ltr"><span style="white-space: pre-wrap;">Une fois activé, ce contenu est affiché à tout le monde, avant et après la connexion : sur la page de connexion, y compris pour les visiteurs non connectés, et en haut de la page des environnements pour les élèves. (seul le contenu avec </span><code spellcheck="false" style="white-space: pre-wrap;"><span class="lexical-code">slug = login-announcement</span></code><span style="white-space: pre-wrap;"> est affiché de cette façon.)</span></p>
            - column:
                name: slug
                value: login-announcement
            - column:
                name: title
                value: Login announcement
