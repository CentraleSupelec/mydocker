databaseChangeLog:
- changeSet:
    id: 1754908518559-4
    author: mohamedalibarka (generated)
    changes:
    - addColumn:
        columns:
        - column:
            name: created_at
            type: timestamp(6)
        tableName: users_courses
- changeSet:
    id: 1754908518559-5
    author: mohamedalibarka (generated)
    changes:
    - addColumn:
        columns:
        - column:
            name: last_start_date
            type: timestamp(6)
        tableName: users_courses
- changeSet:
    id: 1754908518559-6
    author: mohamedalibarka
    changes:
      - sql:
          sql: |
            UPDATE users_courses uc
            SET last_start_date = COALESCE(sub.latest_date, DATE '2022-10-01')
            FROM (
              SELECT
                uc.user_id,
                uc.course_id,
                MAX(alr.created_on) AS latest_date
              FROM users_courses uc
              LEFT JOIN activity_log_records alr
                ON alr.user_id = uc.user_id
              AND alr.model_name = 'COURSE'
              AND NULLIF(REGEXP_REPLACE(alr.model_id, 'test-build-[0-9]+-for-image-[0-9]+', 'test-build', 'g'), 'test-build')::bigint = uc.course_id
              AND alr.action IN ('ENVIRONMENT_ASK', 'ENVIRONMENT_RESTART')
              GROUP BY uc.user_id, uc.course_id
            ) sub
            WHERE uc.user_id = sub.user_id
              AND uc.course_id = sub.course_id;


- changeSet:
    id: 1754908518559-7
    author: mohamedalibarka
    changes:
      - sql:
          sql: |
            UPDATE users_courses uc
            SET created_at = COALESCE(sub.created_at, DATE '2022-10-01')
            FROM (
              SELECT
                uc.user_id,
                uc.course_id,
                MIN(alr.created_on) AS created_at
              FROM users_courses uc
              LEFT JOIN activity_log_records alr
                ON alr.user_id = uc.user_id
              AND alr.model_name = 'COURSE'
              AND NULLIF(REGEXP_REPLACE(alr.model_id, 'test-build-[0-9]+-for-image-[0-9]+', 'test-build', 'g'), 'test-build')::bigint = uc.course_id
              AND alr.action = 'ENVIRONMENT_ASK'
              GROUP BY uc.user_id, uc.course_id
            ) sub
            WHERE uc.user_id = sub.user_id
              AND uc.course_id = sub.course_id;
