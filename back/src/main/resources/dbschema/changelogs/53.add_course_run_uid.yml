databaseChangeLog:
- changeSet:
    id: 1793800000000-1
    author: snesiubedreag
    comment: >-
      Add courses.run_uid, the user ("uid" or "uid:gid") the student container runs as.

      Nullable with no backfill: an empty value keeps the image's own user, which is the
      behaviour of every existing course.
    changes:
    - addColumn:
        tableName: courses
        columns:
        - column:
            name: run_uid
            type: VARCHAR(255)
    rollback:
    - dropColumn:
        tableName: courses
        columnName: run_uid
