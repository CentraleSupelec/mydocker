## App Properties
app.jwtSecret = Secret
app.jwtExpirationInMs = 86400000

app.cas.rscUrl=http://localhost:9443/cas/p3/serviceValidate
app.cas.service=http://localhost:4200/loginAccept
app.image_name=sip_tuto

app.frontend.url=http://localhost:4200

app.testConnectionScheduler.errorCodes=410,502,503
app.testConnectionScheduler.disableSslValidation=false

go.debug = false
# Environment logs are the largest response the Go API sends; gRPC's own default is 4 MiB.
go.app.max-inbound-message-size = 16777216
# Shared token the Go API sends in X-Autoscaling-Token to GET /internal/autoscaling/{clusterName}/compute-types.
# Unset or empty: the endpoint answers 403 to every request.
#autoscaling_pull_token=

## Sentry properties
sentry.dsn = https://example@sentry.io/123456
sentry.environment = development
sentry.exception-resolver-order=-2147483647
sentry.in-app-includes=fr.centralesupelec.thuv

context_save_path = /opt/contexts/
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.url=jdbc:postgresql://localhost:5432/thuv
spring.datasource.username=thuv
spring.datasource.password=password
#spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = validate
spring.liquibase.change-log=classpath:dbschema/master.xml
# Upgrade from one Go API to clusters: the "default" cluster is seeded from these (changeset 51).
# Every properties file the back end starts with must declare all four, empty when unknown.
spring.liquibase.parameters.defaultClusterGoAddress=${go.app.address:}
spring.liquibase.parameters.defaultClusterGoPort=${go.app.port:50000}
spring.liquibase.parameters.defaultClusterTerraformStateUrl=${scale-up.terraformStateUrl:}
spring.liquibase.parameters.defaultClusterDeploymentEnabled=${deployment_enabled:false}

debug=true

logging.level.fr.centralesupelec.thuv=INFO

spring.task.scheduling.pool.size=50

# Spring mail
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.username=#{null}
spring.mail.password=#{null}
spring.mail.properties.mail.smtp.auth=#{null}
spring.mail.properties.mail.smtp.starttls.enable=#{null}
notification.mails.to[0]=monitoring@example.com
notification.mails.from=noreply@example.com

lti.base-path=http://localhost:8080
lti.private-key-path=classpath:private_key.pem
lti.public-key-path=classpath:public_key.pem

spring.mustache.prefix=classpath:/templates/
spring.mustache.suffix=.html

deployment_delay_in_milliseconds=300000
deployment_enabled=true

oidc.audience=mydocker-local
oidc.issuer=https://keycloak.centralesupelec.fr/realms/mydocker-cs-preprod

app.magic_link.expiration_in_minutes = 5
polling_interval_user_courses_in_milliseconds = 60000

## Saving of student work. Off on every deployment; the saveData endpoint returns 403.
save.student-work.enabled = false

test_username =#{null}
test_password =#{null}

grpc.tls.client-key-path=classpath:tls/client.key
grpc.tls.client-cert-path=classpath:tls/client.crt
grpc.tls.ca-cert-path=classpath:tls/ca.crt
javax.net.debug=true

# AES-256 key (base64, 32 bytes) for encrypting SlurmCluster.secretKey at rest
# Delivered from Ansible vault via the SLURM_SECRET_ENCRYPTION_KEY
# environment variable. Generate with: openssl rand -base64 32
slurm.secret-encryption-key=${SLURM_SECRET_ENCRYPTION_KEY:}
# Whether a missing key aborts startup. Defaults to FALSE so that releasing this
# code cannot take a running back-end down: preprod and prod have no key
# provisioned yet, and a true default would refuse to start there. Set it to
# true from provisioning once the key is actually delivered, which turns a
# missing key into a startup failure instead of a silent downgrade.
#
# Independently of this flag, a missing key never results in a secret being
# written in clear: SlurmSecretCipher refuses the write outright.
slurm.secret-encryption-required=${SLURM_SECRET_ENCRYPTION_REQUIRED:false}
